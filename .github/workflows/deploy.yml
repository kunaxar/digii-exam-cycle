name: Build and deploy Exam Cycle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import current authored source once
        run: |
          python3 - <<'PYCODE'
          import base64,tarfile,io,os
          if os.path.exists('.source-import-v2'): raise SystemExit(0)
          data=base64.b64decode('')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as t:
              t.extractall('.')
          open('.source-import-v2','w').write('Source imported; subsequent builds use repository source.\n')
          PYCODE
      - name: Preserve source in this new repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-import-v2 README.md package.json package-lock.json app.jsx engine.mjs data.mjs test.mjs style.css index.html
          git diff --cached --quiet || git commit -m 'Add authored Exam Cycle source and rule tests'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
